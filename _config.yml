# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: ClimaXpress
email: iamaditya1.gupta@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  A simple and fast weather application to get real-time climate updates.

# -----------------------------------------------------------------------------
# CRITICAL SETTINGS FOR GITHUB PAGES DEPLOYMENT
# -----------------------------------------------------------------------------
# The full URL to your site, e.g., https://username.github.io
url: "https://Aditya11376.github.io" 

# The subpath of your site, e.g., /repository-name
# If your repository is named "my-blog", this should be "/my-blog".
baseurl: "/Clima-weather-app"
# -----------------------------------------------------------------------------


# Build settings
theme: minima # Or whichever theme you are using (e.g., just-the-docs)
plugins:
  - jekyll-feed
  # Add other plugins here

